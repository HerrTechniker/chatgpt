<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Login – HPS Power Solutions</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="admin-login">
    <div class="login-card" role="form" aria-labelledby="login-title">
      <div>
        <h1 id="login-title">Admin-Bereich</h1>
        <p>Melden Sie sich mit Ihrem Konto an, um Downloads und Benutzer zu verwalten.</p>
      </div>
      <form id="login-form">
        <label for="email">E-Mail-Adresse</label>
        <input id="email" name="email" type="email" autocomplete="username" required />

        <label for="password">Passwort</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <button class="btn btn-primary" type="submit">Anmelden</button>
      </form>
      <div class="notice hidden" id="login-notice" role="alert"></div>
      <p class="form-hint">Standard-Admin: admin@hps-power.local / ChangeMe123!</p>
      <a class="link" href="/">Zurück zur Website</a>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/admin/login.js"></script>
  </body>
</html>
