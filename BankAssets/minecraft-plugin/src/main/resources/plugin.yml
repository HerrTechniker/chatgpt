name: BankAssetsTools
main: com.bankassets.minecraftplugin.Main
version: 1.0.0
api-version: '1.21'
commands:
  invsee:
    description: Öffnet das Inventar eines anderen Spielers.
    usage: /invsee <spieler>
    permission: bankassets.invsee
    aliases: [inv]
  enderchest:
    description: Öffnet deine oder eine andere Enderchest.
    usage: /enderchest [spieler]
    permission: bankassets.enderchest
    aliases: [ec]
  vanish:
    description: Schaltet Unsichtbarkeit ohne Trankeffekt ein oder aus.
    usage: /vanish
    permission: bankassets.vanish
    aliases: [v]
  commandfeedback:
    description: Schaltet Commandrückmeldungen an oder aus.
    usage: /commandfeedback
    permission: bankassets.commandfeedback
permissions:
  bankassets.invsee:
    default: op
  bankassets.enderchest:
    default: true
  bankassets.vanish:
    default: op
  bankassets.commandfeedback:
    default: op
